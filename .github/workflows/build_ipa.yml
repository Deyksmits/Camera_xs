name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O
          
          echo "Info.plist en App Iconen kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.5.0
          name: "AutoCam v1.5.0 (Sleepbare 4-Hoeks Box, Vaste Video Aspect Ratio & Clean UI)"
          body: |
            ### 🚗 AutoCam v1.5.0 - Draggable Box, Single Video & Zero Distortion
            - 🎯 **Sleepbare 4-Hoeks Box**: Er verschijnt direct een bewakingsbox op het scherm waarvan je eenvoudig de 4 hoeken naar wens kunt verslepen (ook handig voor schuin geparkeerde auto's), of de hele box in één keer verplaatst.
            - 🚗 **Slimme Auto Detectie in Rij**: Tik op je auto in een rij auto's en hij pakt direct alleen jouw specifieke auto met een veiligheidsmarge eromheen.
            - 📹 **1 Enkele Notificatie met Video**: Geen dubbele berichten meer! Zodra de beweging stopt ontvang je direct één compleet Telegram bericht met de gecategoriseerde video.
            - 📐 **Geen Vervorming Meer**: Video's worden via AVAssetExportSession direct gecodeerd met een hardware-ingebakken oriëntatie, waardoor Telegram ze altijd met de perfecte resolutie en beeldverhouding toont.
            - 🗓️ **2 Weken Automatisch Opschonen**: Zowel Telegram berichten als lokale opnames worden na exact 14 dagen automatisch verwijderd.
            - ⏳ **5-Seconden Afteller**: 5 seconden bedenktijd na het starten om je iPhone rustig te positioneren.
            - ✨ **Ultra-Clean Frosted Glass UI**: Rustige, minimalistische zwevende knoppenbalken en statusindicatoren.
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
