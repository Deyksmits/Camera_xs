name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O
          
          echo "Info.plist kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.2.0
          name: "AutoCam v1.2.0 (Smart Motion Trigger & AI Object Categorization)"
          body: |
            ### 🚗 AutoCam v1.2.0 - Smart Motion Trigger & AI Object Categorization
            - 🎯 **Slimme Bewegingsdetectie in de Zone**: Start direct met foto en video bij elke betekenisvolle beweging binnen het getekende vak.
            - 🍃 **Ruis- & Blaadjesfilter**: Wiskundige ruimtelijke spreiding en drempelwaarde filteren kleine voorbijvliegende blaadjes, muggen en sensorruis effectief weg.
            - 🧠 **Post-Exit AI Classificatie**: Zodra het object weer uit beeld / uit de zone is, analyseert Apple Vision AI lokaal of het object een **Persoon**, **Fietser**, **Auto** of **Ander object** was.
            - 📁 **Opslag in Mapjes**: Video's en snapshots worden respectievelijk opgeslagen in `Recordings/Personen`, `Recordings/Fietsers`, `Recordings/Autos` en `Recordings/Overig`.
            - 📲 **Aangepast Telegram Bericht**: Het verzonden Telegram bericht en videobestand worden voorzien van de juiste categorie, emoji en metadata.
            - 🛡️ **TrollStore Ready**: Direct te installeren op iPhone Xs (iOS 14 - 17.0).
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
