name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O > compile_output.txt 2>&1 || true
          
          cat compile_output.txt
          echo "### 📋 Swift Compiler Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat compile_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ ! -f build/AutoCam.app/AutoCam ]; then
            echo "❌ Binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f compile_output.txt
            git commit -m "Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          echo "Info.plist en App Iconen kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.7.3
          name: "AutoCam v1.7.3 (Geavanceerd Nachtzicht & Helderheid Boost)"
          body: |
            ### 🚗 AutoCam v1.7.3 - Geavanceerd Nachtzicht & Helderheid Boost
            - 🌙 **Maximale Nachtzichtbaarheid**: Zwart-wit (Monochrome) conversie in het donker elimineert ~85% van de kleurruis (chroma noise), waardoor details direct scherp en helder worden.
            - ⚡ **Gamma Curve & Schaduwlifting**: Donkere zones worden automatisch opgelicht met `CIGammaAdjust` (power 0.65) en dynamisch contrast (1.35x), zodat voertuigen en personen in het pikkedonker direct zichtbaar zijn.
            - 🔍 **Luminance Edge Sharpening**: Scherpt contouren en randen aan voor mens- en autoherkenning in het donker.
            - 🎥 **Nachtvideocompositie voor Telegram**: Geëxporteerde Telegram video's worden automatisch behandeld met de nachtzichtfilter voor kristalheldere incidentopnames.
            - 🎯 **Adaptieve Nachtbewegingsdetectie**: Gevoeligheid van de zone wordt automatisch fijn afgestemd voor subtiele bewegingen in diepe schaduwen.
            - 👆 **Tik om te Wekken**: 1-tik op het zwarte scherm keert direct terug naar de interface.
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
