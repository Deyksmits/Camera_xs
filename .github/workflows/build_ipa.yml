name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O
          
          echo "Info.plist kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.1.0
          name: "AutoCam v1.1.0 (Auto Video Recording + Proximity Alert)"
          body: |
            ### 🚗 AutoCam v1.1.0 - Auto Video Recording
            - 🎥 **Automatische Video-Opname**: Neemt nu automatisch videoclips op zodra een persoon dichtbij of in de auto-zone wordt gedetecteerd.
            - 📁 **Lokale Opslag & Clips Galerij**: Bewaart video's in de iOS Bestanden app en iOS Foto's / Camera Roll. Bekijk en beheer ze via de in-app Clips knop.
            - 📲 **Telegram Snapshot & Video**: Ontvang direct een foto-notificatie én de volledige bewakingsvideo op je telefoon via Telegram.
            - ⚡ **100% Lokaal & Privacy**: Beeldanalyse gebeurt real-time op de Apple A12 Neural Engine van de iPhone Xs.
            - 🛡️ **TrollStore Ready**: Direct te installeren op iPhone Xs zonder certificaatbeperkingen.
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
