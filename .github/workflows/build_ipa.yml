name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O
          
          echo "Info.plist en App Iconen kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.4.0
          name: "AutoCam v1.4.0 (Full Car Outline, 5s Timer, 2-Week Cleanup & Modern UI)"
          body: |
            ### 🚗 AutoCam v1.4.0 - Major UI & AI Upgrade
            - 🚘 **Complete Auto Omlijning**: Geavanceerde multi-saliency detectie die alle componenten van de auto samenvoegt tot één complete omtrek inclusief ruime veiligheidsmarge.
            - ✏️ **Zelf Tekenen Behouden**: Eenvoudig schakelen tussen `🚗 Auto Box` (1-tik) en `✏️ Zelf Tekenen` (vrij hoekpunten plaatsen).
            - ⏳ **5-Seconden Start Timer**: Na tikken op `▶ Start` start een rustige afteller van 5s zodat je de iPhone rustig op zijn plek kunt zetten zonder valse meldingen.
            - 🗓️ **2 Weken Bewaartermijn**: Beelden en video's worden na 14 dagen (2 weken) automatisch gewist uit Telegram en lokale opslag.
            - ✨ **Moderne Frosted Glass Interface**: Prachtige UI met glas-effecten, neon-indicatoren, heldere statusbalk en Kia EV9 app-icoon.
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
