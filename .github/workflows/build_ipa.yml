name: Build VibeCoded Apps (AutoCam, SmartDash, NetShield)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer VibeCoded Apps naar iOS arm64 Binaries
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # -------------------------------------------------------------
          # 1. AUTOCAM (Parkeerbewaking & Surveillance)
          # -------------------------------------------------------------
          echo "=== 🛡️ Compileren van AutoCam ==="
          mkdir -p build/AutoCam.app
          
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O > autocam_compile_output.txt 2>&1 || true
          
          cat autocam_compile_output.txt
          
          if [ ! -f build/AutoCam.app/AutoCam ]; then
            echo "❌ AutoCam binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f autocam_compile_output.txt
            git commit -m "AutoCam Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          chmod +x build/AutoCam.app/AutoCam
          codesign -s - --force --deep build/AutoCam.app
          
          mkdir -p Payload_AutoCam/Payload
          cp -r build/AutoCam.app Payload_AutoCam/Payload/
          cd Payload_AutoCam && zip -r ../AutoCam.ipa Payload && cd ..
          echo "✅ AutoCam.ipa gereed!"
          
          # -------------------------------------------------------------
          # 2. SMARTDASH (Cockpit HUD & Dual Dashcam)
          # -------------------------------------------------------------
          echo "=== 🚗 Compileren van SmartDash ==="
          mkdir -p build/SmartDash.app
          
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            SmartDash/AppDelegate.swift \
            SmartDash/SpeedCameraManager.swift \
            SmartDash/PerformanceTimer.swift \
            SmartDash/MotionGForceDetector.swift \
            SmartDash/DualDashcamRecorder.swift \
            SmartDash/ClipsGalleryViewController.swift \
            SmartDash/ViewController.swift \
            -o build/SmartDash.app/SmartDash \
            -O > smartdash_compile_output.txt 2>&1 || true
          
          cat smartdash_compile_output.txt
          
          if [ ! -f build/SmartDash.app/SmartDash ]; then
            echo "❌ SmartDash binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f smartdash_compile_output.txt
            git commit -m "SmartDash Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          cp SmartDash/Info.plist build/SmartDash.app/Info.plist
          cp SmartDash/*.png build/SmartDash.app/ 2>/dev/null || true
          chmod +x build/SmartDash.app/SmartDash
          codesign -s - --force --deep build/SmartDash.app
          
          mkdir -p Payload_SmartDash/Payload
          cp -r build/SmartDash.app Payload_SmartDash/Payload/
          cd Payload_SmartDash && zip -r ../SmartDash.ipa Payload && cd ..
          echo "✅ SmartDash.ipa gereed!"

          # -------------------------------------------------------------
          # 3. NETSHIELD (24/7 Thuisnetwerk DNS AdBlocker)
          # -------------------------------------------------------------
          echo "=== 🛡️ Compileren van NetShield ==="
          mkdir -p build/NetShield.app
          
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            NetShield/AppDelegate.swift \
            NetShield/BlocklistManager.swift \
            NetShield/DNSEngine.swift \
            NetShield/WebDashboardServer.swift \
            NetShield/RouterGuideViewController.swift \
            NetShield/ViewController.swift \
            -o build/NetShield.app/NetShield \
            -O > netshield_compile_output.txt 2>&1 || true
          
          cat netshield_compile_output.txt
          
          if [ ! -f build/NetShield.app/NetShield ]; then
            echo "❌ NetShield binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f netshield_compile_output.txt
            git commit -m "NetShield Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          cp NetShield/Info.plist build/NetShield.app/Info.plist
          cp NetShield/*.png build/NetShield.app/ 2>/dev/null || true
          chmod +x build/NetShield.app/NetShield
          
          if [ -f NetShield/Entitlements.plist ]; then
            codesign -s - --force --deep --entitlements NetShield/Entitlements.plist build/NetShield.app
          else
            codesign -s - --force --deep build/NetShield.app
          fi
          
          mkdir -p Payload_NetShield/Payload
          cp -r build/NetShield.app Payload_NetShield/Payload/
          cd Payload_NetShield && zip -r ../NetShield.ipa Payload && cd ..
          echo "✅ NetShield.ipa gereed!"

          # -------------------------------------------------------------
          # 4. HOMESENTRY (Trap & Voordeur Bewaking, Akoestische AI & Klimaat)
          # -------------------------------------------------------------
          echo "=== 🛡️ Compileren van HomeSentry ==="
          mkdir -p build/HomeSentry.app
          
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            HomeSentry/AppDelegate.swift \
            HomeSentry/AcousticSentryEngine.swift \
            HomeSentry/EnvironmentalEngine.swift \
            HomeSentry/ZoneMotionDetector.swift \
            HomeSentry/WebDashboardServer.swift \
            HomeSentry/ViewController.swift \
            -o build/HomeSentry.app/HomeSentry \
            -O > homesentry_compile_output.txt 2>&1 || true
          
          cat homesentry_compile_output.txt
          
          if [ ! -f build/HomeSentry.app/HomeSentry ]; then
            echo "❌ HomeSentry binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f homesentry_compile_output.txt
            git commit -m "HomeSentry Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          cp HomeSentry/Info.plist build/HomeSentry.app/Info.plist
          cp HomeSentry/*.png build/HomeSentry.app/ 2>/dev/null || true
          chmod +x build/HomeSentry.app/HomeSentry
          codesign -s - --force --deep build/HomeSentry.app
          
          mkdir -p Payload_HomeSentry/Payload
          cp -r build/HomeSentry.app Payload_HomeSentry/Payload/
          cd Payload_HomeSentry && zip -r ../HomeSentry.ipa Payload && cd ..
          echo "✅ HomeSentry.ipa gereed!"

      - name: Upload Artifacts (AutoCam, SmartDash, NetShield & HomeSentry)
        uses: actions/upload-artifact@v4
        with:
          name: VibeCoded-IPAs
          path: |
            AutoCam.ipa
            SmartDash.ipa
            NetShield.ipa
            HomeSentry.ipa

      - name: Maak GitHub Release (Directe Download voor TrollStore)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v3.3.0
          name: "VibeCoded Apps v3.3 (AutoCam Remote Box Sync, HomeSentry Fix & Unique App Icons)"
          body: |
            ### ⚡ VibeCoded iOS Apps voor TrollStore (v3.3)

            - 🛡️ **AutoCam.ipa (v2.1 Pro)**:
              - **Nieuwe Synchrone Box Uitlijning**: De bewakingsbox omlijning is nu 100% identiek en synchroon tussen de camera op de iPhone en meekijken op je andere telefoon!
              - Professionele CCTV parkeerbewaking met AI ruis- en reflectiefilter (poort 8081).
              - Uniek ontworpen modern surveillance icoon.
            - 🏠 **HomeSentry.ipa (v1.1)**:
              - **Opstart Hersteld**: Start nu direct en probleemloos op binnen de standaard sandbox met directe camerabewaking en audiomonitoring.
              - **Trap-naar-Voordeur Bewaking**: Gericht vanaf de trap op de voordeur met configureerbare zone.
              - **24/7 Akoestische Sensor AI**: Detecteert automatisch **glasbreuk**, **piepende rookmelders (3.1 kHz)**, **waterlekkage/druppels** en deurbel/geklop.
              - **Klimaat & Barometer Telemetrie**: Realtime temperatuur (°C), barometer (hPa) en voordeur tocht-detectie.
              - **Ingebouwd Web Dashboard (Poort 8082)**: Live meekijken, temperatuur & sensoren uitlezen via `http://<iphone-ip>:8082/?key=<PIN>`.
              - **Telegram Spoed Alarm**: Stuurt direct video bij personen/pakketjes én directe alarmering bij glasbreuk of brandalarm.
              - Uniek ontworpen modern emerald home sentry icoon.
            - 🌐 **NetShield.ipa (v1.1 Pro)**: 24/7 Thuisnetwerk DNS AdBlocker met Web Dashboard (poort 8080) en uniek cyber shield icoon.
            - 🏎️ **SmartDash.ipa (v1.1)**: Cockpit HUD & Dual-Cam dashcam met Flitsmeister flitsers, dragtimer en uniek cockpit telemetry icoon.

            #### 📲 Installatie:
            1. Download de gewenste `.ipa` hieronder op je iPhone.
            2. Open het bestand in **TrollStore** en tik op **Install**.
          files: |
            AutoCam.ipa
            SmartDash.ipa
            NetShield.ipa
            HomeSentry.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
