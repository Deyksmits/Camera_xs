name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O > compile_output.txt 2>&1 || true
          
          cat compile_output.txt
          echo "### 📋 Swift Compiler Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat compile_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ ! -f build/AutoCam.app/AutoCam ]; then
            echo "❌ Binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f compile_output.txt
            git commit -m "Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          echo "Info.plist en App Iconen kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.0
          name: "AutoCam v2.0.0 (Volwaardige Dual-Mode: Bewaking + Slimme Dashcam)"
          body: |
            ### 🚗 AutoCam v2.0.0 - Volwaardige Dual-Mode iPhone App
            
            **AutoCam is nu getransformeerd tot een volwaardige 2-in-1 beveiligings- en dashcam-app voor iOS:**

            #### 🛡️ Modus 1: Slimme Parkeerbewaking (met Ultra Accubesparing)
            - 🔋 **Accu-Duurzaamheid**: Detecteert automatisch wanneer de iPhone van de lader wordt gehaald en schakelt over naar een ultra-energiezuinige detectie-engine (3 FPS) met OLED-pitch-black scherm binnen 4 seconden. Zo gaat de accu urenlang mee!
            - 🎯 **Interactieve Bewakingszone**: Stel een 4-punts polygonzone in rond je auto met sleepbare hoeken en automatische voertuigdetectie.
            - 🌙 **Geavanceerd Nachtzicht**: Ruisloze monochrome modus met gammacurve schaduwlifting en randverscherping.
            - 📲 **Telegram Incident Notificaties**: Exact 1 video per beweging met automatische classificatie (Persoon, Auto, Fietser) en 14-dagen retentiebeheer.

            #### 🚗 Modus 2: Slimme Dashcam (Loop Recording & Crashdetectie)
            - 🔁 **Rolling Loop Buffer**: Filmt continu in blokken van 3 minuten met automatische recycling van oude beelden tot max 6 GB.
            - 💥 **G-Sensor Impactdetectie**: Continue CoreMotion accelerometer analyse (40 Hz). Bij plotselinge botsing of harde noodstop (> 2.4G) worden segmenten direct vergrendeld in `ImpactEvents` en wordt een Telegram noodnotificatie gestuurd.
            - 📍 **GPS & Snelheid HUD**: Real-time snelheidsweergave in km/u en GPS-coördinaten.
            - ⚡ **Auto-Start / Auto-Stop bij Contact**: Zodra de auto start en de iPhone stroom krijgt, start de Dashcam loop direct. Zodra het contact uitgaat, sluit de opname netjes af en schakelt de app automatisch over naar Parkeerbewakingsmodus!

            #### 🌐 Web Remote & Telegram Controller
            - Schakel overal ter wereld tussen Dashcam en Bewakingsmodus via de vernieuwde Web Remote en Telegram commando's (`/dashcam`, `/bewaking`, `/rec`).
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
