name: Build TrollStore IPAs (AutoCam + SmartDash)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer AutoCam & SmartDash naar iOS arm64 Binaries
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # -------------------------------------------------------------
          # 1. AUTOCAM (Parkeerbewaking & Surveillance)
          # -------------------------------------------------------------
          echo "=== 🛡️ Compileren van AutoCam ==="
          mkdir -p build/AutoCam.app
          
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O > autocam_compile_output.txt 2>&1 || true
          
          cat autocam_compile_output.txt
          echo "### 📋 AutoCam Swift Compiler Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat autocam_compile_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ ! -f build/AutoCam.app/AutoCam ]; then
            echo "❌ AutoCam binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f autocam_compile_output.txt
            git commit -m "AutoCam Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          echo "AutoCam Info.plist en App Iconen kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          chmod +x build/AutoCam.app/AutoCam
          codesign -s - --force --deep build/AutoCam.app
          
          mkdir -p Payload_AutoCam/Payload
          cp -r build/AutoCam.app Payload_AutoCam/Payload/
          cd Payload_AutoCam && zip -r ../AutoCam.ipa Payload && cd ..
          echo "✅ AutoCam.ipa succesvol gemaakt!"
          
          # -------------------------------------------------------------
          # 2. SMARTDASH (Standalone 30 FPS Dual-Cam & Cockpit HUD)
          # -------------------------------------------------------------
          echo "=== 🚗 Compileren van SmartDash ==="
          mkdir -p build/SmartDash.app
          
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            SmartDash/AppDelegate.swift \
            SmartDash/SpeedCameraManager.swift \
            SmartDash/PerformanceTimer.swift \
            SmartDash/MotionGForceDetector.swift \
            SmartDash/DualDashcamRecorder.swift \
            SmartDash/ClipsGalleryViewController.swift \
            SmartDash/ViewController.swift \
            -o build/SmartDash.app/SmartDash \
            -O > smartdash_compile_output.txt 2>&1 || true
          
          cat smartdash_compile_output.txt
          echo "### 📋 SmartDash Swift Compiler Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat smartdash_compile_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ ! -f build/SmartDash.app/SmartDash ]; then
            echo "❌ SmartDash binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f smartdash_compile_output.txt
            git commit -m "SmartDash Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          echo "SmartDash Info.plist en App Iconen kopiëren..."
          cp SmartDash/Info.plist build/SmartDash.app/Info.plist
          cp SmartDash/*.png build/SmartDash.app/ 2>/dev/null || true
          chmod +x build/SmartDash.app/SmartDash
          codesign -s - --force --deep build/SmartDash.app
          
          mkdir -p Payload_SmartDash/Payload
          cp -r build/SmartDash.app Payload_SmartDash/Payload/
          cd Payload_SmartDash && zip -r ../SmartDash.ipa Payload && cd ..
          echo "✅ SmartDash.ipa succesvol gemaakt!"

      - name: Upload Artifacts (AutoCam & SmartDash)
        uses: actions/upload-artifact@v4
        with:
          name: TrollStore-IPAs
          path: |
            AutoCam.ipa
            SmartDash.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.3.0
          name: "SmartDash v1.2 (Sleek Cockpit UI, Mijlpaal Acceleratie & Flitsers) + AutoCam v2.1 (Professionele Surveillance)"
          body: |
            ### 🚗 Twee Geoptimaliseerde iPhone Apps voor TrollStore!

            #### 🏎️ 1. SmartDash v1.2 (`SmartDash.ipa`) - Professionele Cockpit HUD & Dual-Cam Dashcam
            - 🧭 **Centrale Digitale Snelheidsmeter**: Hypermoderne, haarscherpe typografie exact in het midden (in landscape en portrait) zonder overbodige labels.
            - 🚨 **Flitsmeister-Stijl Radar Notificaties**: Authentiek Nederlands verkeersbord voor max. snelheid, camera-type badge (Trajectcontrole / Vaste Flitspaal), naderingsafstand in meters en subtiele dynamische voortgangsbalk aan de linkerzijde.
            - ⚡ **Intelligente Acceleratie Mijlpaal-Meting**: Detecteert snelle optrekmomenten en berekent de exacte tijd van 0 naar het afgeronde tiental (bijv. 0 naar 78 km/u -> berekent tijd naar 70 km/u) als gestroomlijnde notificatie en compact scorebord.
            - 🎯 **G-Kracht Meter & Dual Opname Timer**: Live telemetrie crosshair dial met live numerieke uitlezing en compacte segmenttimer aan de rechterzijde.
            - ⚙️ **Overzichtelijk Instellingentab**: Alle extra knoppen netjes weggestopt in een handig instellingenblad (HUD spiegelmodus, noodclip, rittengalerij, flitserafstand en telemetrie reset).

            #### 🛡️ 2. AutoCam v2.1 (`AutoCam.ipa`) - Professionele Parkeersurveillance
            - 🏢 **Professionele Security Cam UI**: Transformeert de interface naar een industriële CCTV / NVR bewakingsfeed (UniFi Protect / Axis stijl).
            - 🎯 **Tactische Viewfinder Reticles**: Subtiele optische hoekmarkeringen en cameraindicator (`CAM-01 • SURVEILLANCE`).
            - ⏱️ **Live CCTV Timecode**: Realtime monospaced tijdstempel en sensortelemetrie in de OSD-balk.
            - 📐 **Tactische Guard Zone**: Blueprint-stijl perimeter met [P1]...[P4] doelwit-reticles en technische statusbadge.
            - 🛡️ **Tactische Bewakingsconsole**: Prominente status- en inschakelschakelaar met een geordende, compacte 5-knoppenbalk.
          files: |
            AutoCam.ipa
            SmartDash.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
