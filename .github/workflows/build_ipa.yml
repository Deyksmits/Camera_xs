name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O
          
          echo "Info.plist en App Iconen kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.6.0
          name: "AutoCam v1.6.0 (Zero-Touch Afstandsbediening, Web Remote & Telegram Bot)"
          body: |
            ### 🚗 AutoCam v1.6.0 - 100% Zero-Touch Remote Control & Live Web Configurator
            - 🌐 **Ingebouwde Web Afstandsbediening**: Open in Safari op je andere iPhone (of laptop) de link van je camera-iPhone. Bekijk live wat de camera ziet, sleep de 4 hoeken van de box over je auto en start/stop de bewaking met één tik!
            - 🤖 **Telegram Tweerichtings-Commando's**:
              - `/arm` of `/start` - Bewaking op afstand aanzetten
              - `/disarm` of `/stop` - Bewaking tijdelijk uitzetten (geen meldingen van jezelf als je naar de auto loopt!)
              - `/foto` of `/snap` - Direct een live foto van je auto opvragen in Telegram
              - `/status` - Batterijpercentage, laadstatus, opslagruimte en status bekijken
              - `/web` - Krijg direct de link naar de web-afstandsbediening
            - 📲 **Automatische Online Pings**: Zodra de camera-iPhone in de houder staat stuurt de app automatisch een berichtje naar je Telegram met de directe link naar de afstandsbediening.
            - 🎯 **100% Hands-Off**: Plaats je iPhone Xs in de autohouder en raak hem nooit meer aan. Alles kan op afstand bediend worden!
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
