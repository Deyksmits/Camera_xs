name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O
          
          echo "Info.plist en App Iconen kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.7.0
          name: "AutoCam v1.7.0 (10 FPS Sensor, Auto Night Boost, OLED Black Screen & Protected VPN Remote)"
          body: |
            ### 🚗 AutoCam v1.7.0 - Ultieme Auto Bewaking & Stealth Update
            - 🌐 **Protected Remote & Tailscale VPN**: Toegang tot de live web afstandsbediening vanaf elke locatie via Tailscale VPN of lokaal Wi-Fi, beveiligd met een PIN toegangscode.
            - 🌙 **Automatische Nachtmodus & Helderheid Booster**: Continue meting van omgevingslicht (Luma). Schakelt automatisch hardware low-light boost, langere sluitertijd (tot 1/10s) en +1.8 EV belichting in zodra het donker wordt buiten.
            - ⚡ **10 FPS Sensor & Opname**: Sensor en video-opname draaien strikt op 10 fps. Dit vangt tot 300% meer natuurlijk licht op per frame in het donker, houdt de iPhone Xs koel en bespaart accu en opslagruimte.
            - 🧠 **Objectdetectie Alleen op 1e Frame**: Zodra beweging binnen de polygoonzone optreedt, wordt ALLEEN het allereerste frame direct geanalyseerd met Apple Vision AI (persoon, fietser, auto, overig). Geen CPU-verspilling tijdens het filmen.
            - 🕶️ **100% OLED Pikzwart Scherm**: Scherm wordt volledig zwart zonder enige gloed (geen klok, geen tijd, geen cijfers). Dubbel-tik op het scherm wekt het toestel; schakelt automatisch na 25s weer uit.
            - 🤖 **Uitgebreide Telegram Bot**:
              - `/arm` / `/stop` - Bewaking aan- en uitzetten
              - `/foto` - Live camerabeeld opvragen
              - `/box` - Camerabeeld met groene detectiebox opvragen
              - `/box auto` - Auto automatisch detecteren en omlijnen
              - `/box reset` - Box herstellen naar standaard
              - `/night [auto|on|off]` - Nachtmodus & Helderheid Booster schakelen
              - `/screen [off|on]` - Scherm 100% pikzwart zetten of weer verlichten
              - `/pin <nieuwe_pin>` - Web PIN toegangscode wijzigen
              - `/status` - Accu, 10 FPS, nachtmodus, luma, schermstatus en VPN links
              - `/web` - Directe links met 1-tik login token naar de web remote
            - 🎨 **Professionele & Schone UI**: Frosted glass status badges, responsive web remote en complete afstandsbediening zonder de telefoon in de auto aan te raken!
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
