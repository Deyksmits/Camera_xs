name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --version

      - name: Compileer Swift naar iOS arm64 Binary
        run: |
          set -e
          echo "Xcode SDK bepalen..."
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          mkdir -p build/AutoCam.app
          
          echo "Compileren van AutoCam..."
          xcrun swiftc \
            -sdk "$SDK_PATH" \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            AutoCam/AppDelegate.swift \
            AutoCam/ViewController.swift \
            -o build/AutoCam.app/AutoCam \
            -O > compile_output.txt 2>&1 || true
          
          cat compile_output.txt
          echo "### 📋 Swift Compiler Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat compile_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ ! -f build/AutoCam.app/AutoCam ]; then
            echo "❌ Binary was niet gemaakt!"
            git config user.name "Build Bot"
            git config user.email "bot@github.com"
            git checkout -B build-error
            git add -f compile_output.txt
            git commit -m "Swift compile error log" || true
            git push -f origin build-error || true
            exit 1
          fi
          
          echo "Info.plist en App Iconen kopiëren..."
          cp AutoCam/Info.plist build/AutoCam.app/Info.plist
          cp AutoCam/*.png build/AutoCam.app/ 2>/dev/null || true
          
          echo "Zorg dat binary uitvoerbaar is..."
          chmod +x build/AutoCam.app/AutoCam
          
          echo "Ad-hoc codesign toepassen voor TrollStore..."
          codesign -s - --force --deep build/AutoCam.app

      - name: Inpakken als IPA
        run: |
          mkdir -p Payload
          cp -r build/AutoCam.app Payload/
          zip -r AutoCam.ipa Payload
          echo "AutoCam.ipa succesvol gemaakt!"

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: AutoCam-IPA
          path: AutoCam.ipa

      - name: Maak Directe Download Release (Voor 1-Klik Installatie op iPhone)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.7.1
          name: "AutoCam v1.7.1 (Telegram Inline Box Controller, Cleaner Updates & Remote Fix)"
          body: |
            ### 🚗 AutoCam v1.7.1 - Telegram Inline Box Controller & Schone Updates
            - 🎮 **Interactieve Box Afstandsbediening in Telegram**: Beheer en verplaats de bewakingszone direct in Telegram met interactieve inline knoppen (`⬆️`, `⬇️`, `⬅️`, `➡️`, `➕ Groter`, `➖ Kleiner`, `🚗 Auto Box`, `🔄 Reset`). Werkt altijd en overal ter wereld op elke verbinding (ook 4G/5G) zonder poorten of routers in te stellen!
            - 🔕 **Geen Telegram Spam**: Geen ongevraagde 'Camera online' berichten meer bij opstarten of herverbinden.
            - 📹 **Zuivere Video & Objectdetectie**: Bij incidenten wordt uitsluitend de video gestuurd met een compacte notificatie van het gedetecteerde object (persoon, fietser, auto, overig) en de tijdsduur.
            - 🌐 **Web Remote Link Alleen op Verzoek**: De Safari / Tailscale web remote links worden nu uitsluitend getoond wanneer je expliciet `/web` of `/status` opvraagt.
            - ⌨️ **Korte & Snelle Commando's**: `/arm` en `/stop` reageren direct met een korte statusregel zonder lappen tekst of links. Ondersteunt ook commando's als `/box up`, `/box down`, `/box auto`, etc.
            - 🔒 **Tailscale & Wi-Fi Ondersteuning**: Duidelijke uitleg voor lokaal Wi-Fi versus wereldwijde toegang via Tailscale VPN.
          files: AutoCam.ipa
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
